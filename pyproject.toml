[project]
name = "animal-face-cbir"
version = "1.0.0"
description = "Explainable content-based animal face image retrieval with SQLite"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "scikit-image>=0.25,<0.27",
  "scipy>=1.14,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "starlette>=1.0,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]
